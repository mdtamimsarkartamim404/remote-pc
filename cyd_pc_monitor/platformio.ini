; ESP32-2432S028R ("CYD", 2.8" 240x320, plain ESP32-WROOM-32, NO PSRAM) - PC monitor
; Files: src/main.cpp  src/display.h  src/webui.h
[platformio]
default_envs = cyd

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; CYD = 4 MB flash. Plain 4 MB table with big app slot (no OTA)
board_build.partitions = huge_app.csv
board_build.flash_mode = dio

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    bblanchon/ArduinoJson@^7.0.4
    bodmer/TJpg_Decoder@^1.1.0
    bitbank2/AnimatedGIF@^2.1.1
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

build_flags =
    ; ---- microSD slot on the CYD (own VSPI bus) ----
    -DSD_USE_SPI
    -DSD_SPI_BUS=VSPI
    -DSD_SCK=18
    -DSD_MISO=19
    -DSD_MOSI=23
    -DSD_CS=5
    ; SD card SPI speed; if the card fails to mount or reads fail use 25000000 or 20000000
    -DSD_SPI_HZ=40000000
    ; ---- inputs: the CYD has almost no free pins ----
    ; GPIO0 (BOOT button) = page button (short press = next page, 1-4 s = auto-rotate, >4 s = WiFi setup)
    ; optional rotary encoder on the free pins of the P3/CN1 connectors:
    -DENC_A=22
    -DENC_B=27
    -DENC_SW=35
    ; no joystick (GPIO35 has no pull-up, the rest are used) - dummy pins keep the code compiling
    -DNO_JOY
    -DJOY_X=34
    -DJOY_Y=35
    -DJOY_SW=17
    ; the page sprite is 8-bit (76.8 KB) so it fits in internal RAM next to WiFi
    -DSPRITE_DEPTH=8
    ; touch = the real XPT2046_Touchscreen library on VSPI (same as your working tests). VSPI is then NOT available for the SD card.
    -DTOUCH_USE_LIB
    -DDIAG_NO_SD
    ; touch raw values now match the XPT2046_Touchscreen library (no flip needed). Only if the whole picture is rotated 180 deg add -DTOUCH_INV_X -DTOUCH_INV_Y

; ---- DEFAULT: ST7789 CYD (most boards with 2 USB ports: micro + type-C) ----
[env:cyd]
build_flags =
    ${env.build_flags}
    -DDISP_SPI_HZ=40000000

; ---- older single-USB CYD with ILI9341 panel ----
[env:cyd_ili9341]
build_flags =
    ${env.build_flags}
    -DCYD_ILI9341
    -DDISP_SPI_HZ=40000000

; ---- if the picture is noisy / sparkles ----
[env:cyd_20mhz]
build_flags =
    ${env.build_flags}
    -DDISP_SPI_HZ=20000000

; ---- backlight is on GPIO27 on some CYD revisions (screen stays black but alive) ----
[env:cyd_bl27]
build_flags =
    ${env.build_flags}
    -DDISP_SPI_HZ=40000000
    -DPIN_TFT_BL=27
    -DENC_B=16

; ---------- COLOUR fixes (use only if colours look wrong) ----------
; red and blue swapped:
[env:color_bgr]
build_flags =
    ${env.build_flags}
    -DDISP_SPI_HZ=40000000
    -DDISP_RGB_ORDER=1

; colours look inverted (negative) with the default build -> use this env (DISP_INVERT=1):
[env:color_invert]
build_flags =
    ${env.build_flags}
    -DDISP_SPI_HZ=40000000
    -DDISP_INVERT=1

; blocky text? use scaled classic bitmap fonts instead of the DejaVu ones:
[env:cyd_bitmap_fonts]
build_flags =
    ${env.build_flags}
    -DDISP_SPI_HZ=40000000
    -DCYD_BITMAP_FONTS

; picture upside-down / mirrored:
[env:cyd_flip]
build_flags =
    ${env.build_flags}
    -DDISP_SPI_HZ=40000000
    -DDISPLAY_FLIP_Y

; ---------- TOUCH tuning (XPT2046 on 25/32/39/33/36, no extra library needed) ----------
; Tap left/right = prev/next page, swipe left/right = next/prev, drag up/down = brightness,
; tap centre = overview/snooze alert, hold 0.8 s = auto-rotate on/off, hold 2.5 s = night mode.
; If swipes go the wrong way add (in any env):  -DTOUCH_INV_X  -DTOUCH_INV_Y  -DTOUCH_SWAP_XY
; If touch never reacts, also try:  -DTOUCH_NO_IRQ
[env:cyd_touch_inv_x]
build_flags =
    ${env.build_flags}
    -DDISP_SPI_HZ=40000000
    -DTOUCH_INV_X

; ---------- WiFi/AP keeps dropping or the board resets when WiFi starts = power problem ----------
; Use a good USB cable / port first. This env only switches the brown-out reset off for testing.
[env:cyd_nobrownout]
build_flags =
    ${env.build_flags}
    -DDISP_SPI_HZ=40000000
    -DCYD_NO_BROWNOUT

; ---------- page sprite in RAM (smoother redraw, but ~77 KB less RAM for WiFi/web) ----------
[env:cyd_sprite]
build_flags =
    ${env.build_flags}
    -DDISP_SPI_HZ=40000000
    -DCYD_USE_SPRITE

; ---------- faster video: panel SPI 80 MHz (ST7789 often works; if the picture is noisy go back to env:cyd) ----------
[env:cyd_80mhz]
build_flags =
    ${env.build_flags}
    -DDISP_SPI_HZ=80000000

; ---------- SD card enabled, touch = bit-banged (touch less proven than the default) ----------
[env:cyd_sd]
build_flags =
    ${env.build_flags}
    -DDISP_SPI_HZ=40000000
    -UTOUCH_USE_LIB
    -UDIAG_NO_SD
